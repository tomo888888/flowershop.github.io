<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Garden - 注文</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="hero-section order-header">
    <img class="hero-image" src="../images/top_background.png" alt="Flower Garden">
    <div class="hero-overlay"></div>
    <div class="site-header">
      <p class="site-title">Flower Garden</p>
      <nav class="site-nav">
        <a href="products.html">商品紹介</a>
        <a href="order.html">注文</a>
        <a href="lesson.html">教室</a>
        <a href="access.html">アクセス</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="order-section">
      <h1>注文</h1>

      <div class="order-visual">
        <form class="order-form product-order-form" action="#" method="post">
          <h2>注文フォーム</h2>

          <div class="order-product-summary">
            <p>商品名:<span id="selected-product">〇〇〇〇</span></p>
            <p>金　額:<span id="selected-price">〇〇〇〇</span></p>
          </div>
          <input type="hidden" id="item" name="item">
          <input type="hidden" id="price" name="price">

          <label for="name">お名前</label>
          <input type="text" id="name" name="name">

          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email">

          <label for="tel">電話番号</label>
          <input type="tel" id="tel" name="tel">

          <label for="pickup">受取日時</label>
          <input type="text" id="pickup" name="pickup">

          <fieldset>
            <legend>用途</legend>
            <div class="checkbox-list">
              <label><input type="checkbox" name="purpose" value="birthday"> 誕生日</label>
              <label><input type="checkbox" name="purpose" value="celebration"> お祝い</label>
              <label><input type="checkbox" name="purpose" value="mothers-day"> 母の日</label>
              <label><input type="checkbox" name="purpose" value="fathers-day"> 父の日</label>
              <label><input type="checkbox" name="purpose" value="condolence"> お見舞い</label>
              <label><input type="checkbox" name="purpose" value="other"> その他</label>
            </div>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="order-submit">注文</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const product = params.get('product');
    const price = params.get('price');

    if (product) {
      document.getElementById('selected-product').textContent = product;
      document.getElementById('item').value = product;
    }

    if (price) {
      document.getElementById('selected-price').textContent = price;
      document.getElementById('price').value = price;
    }

    document.querySelectorAll('input[name="purpose"]').forEach(checkbox => {
      checkbox.addEventListener('change', function () {
        if (!this.checked) {
          return;
        }

        document.querySelectorAll('input[name="purpose"]').forEach(otherCheckbox => {
          if (otherCheckbox !== this) {
            otherCheckbox.checked = false;
          }
        });
      });
    });
  </script>

  <footer class="site-footer">
    <div class="footer-brand">
      <h2>Flower Garden</h2>
      <p>福岡市〇〇町</p>
    </div>
    <div class="footer-links">
      <a href="products.html">商品紹介</a>
      <a href="order.html">注文</a>
      <a href="lesson.html">教室</a>
      <a href="access.html">アクセス</a>
    </div>
    <div class="footer-map">
      <iframe
        src="https://www.google.com/maps?q=%E7%A6%8F%E5%B2%A1%E7%9C%8C%E5%BA%81&output=embed"
        width="100%"
        height="170"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </footer>
</body>
</html>
