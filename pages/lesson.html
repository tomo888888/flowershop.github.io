<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Garden</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="hero-section order-header">
    <img class="hero-image" src="../images/top_background.png" alt="Flower Garden">
    <div class="hero-overlay"></div>
    <div class="site-header">
      <p class="site-title">Flower Garden</p>
      <nav class="site-nav">
        <a href="products.html">商品紹介</a>
        <a href="order.html">注文</a>
        <a href="lesson.html" class="active">教室</a>
        <a href="access.html">アクセス</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="lesson-section">
      <h1>教室</h1>

      <div class="lesson-intro">
        <p>
          季節に合わせ、ブーケやアレンジ、リース、寄せ植えなど、<br>
          幅広く植物に関するマンスリーレッスンを開催しています。
        </p>
        <dl>
          <div>
            <dt>日程</dt>
            <dd>お申込みフォームをご覧下さい。</dd>
          </div>
          <div>
            <dt>費用：</dt>
            <dd>3,500円</dd>
          </div>
          <div>
            <dt>時間：</dt>
            <dd>1時間30分</dd>
          </div>
          <div>
            <dt>定員：</dt>
            <dd>各回10名以内</dd>
          </div>
        </dl>
      </div>

      <div class="lesson-feature">
        <p class="lesson-month">【今月のレッスン　ナチュラルブーケ】</p>
        <p>
          初めての方でも作りやすい、やわらかな雰囲気のブーケレッスン。<br>
          黄色や白の小花を中心に、<br>
          ふんわりとした動きを感じる花束を一緒に束ねていきます。
        </p>
        <div class="lesson-image-wrap">
          <img src="../images/lesson-1.png" alt="ナチュラルブーケレッスン">
        </div>
      </div>

      <form class="lesson-form" action="#" method="post">
        <h2>お申込みフォーム</h2>

        <label for="lesson-name">お名前</label>
        <input type="text" id="lesson-name" name="name">

        <label for="lesson-tel">電話番号</label>
        <input type="tel" id="lesson-tel" name="tel">

        <label for="lesson-email">メールアドレス</label>
        <input type="email" id="lesson-email" name="email">

        <fieldset>
          <legend>日程</legend>
          <div class="lesson-date-list">
            <label><input type="radio" name="lesson-date" value="monday-1"> 〇月〇日（月曜日）　14時～15時</label>
            <label><input type="radio" name="lesson-date" value="wednesday-1"> 〇月〇日（水曜日）　14時～15時</label>
            <label><input type="radio" name="lesson-date" value="friday-1"> 〇月〇日（金曜日）　14時～15時</label>
            <label><input type="radio" name="lesson-date" value="monday-2"> 〇月〇日（月曜日）　14時～15時</label>
            <label><input type="radio" name="lesson-date" value="wednesday-2"> 〇月〇日（水曜日）　14時～15時</label>
            <label><input type="radio" name="lesson-date" value="friday-2"> 〇月〇日（金曜日）　14時～15時</label>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="lesson-submit">お申込み</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand">
      <h2>Flower Garden</h2>
      <p>&#31119;&#23713;&#24066;&#12295;&#12295;&#30010;</p>
    </div>
    <div class="footer-links">
      <a href="products.html">商品紹介</a>
      <a href="order.html">注文</a>
      <a href="lesson.html">教室</a>
      <a href="access.html">アクセス</a>
    </div>
    <div class="footer-map">
      <iframe
        src="https://www.google.com/maps?q=%E7%A6%8F%E5%B2%A1%E7%9C%8C%E5%BA%81&output=embed"
        width="100%"
        height="170"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </footer>
</body>
</html>
